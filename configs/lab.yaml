# ============================================================
# Group config — EDIT ME (one per group). Values here override
# the track defaults loaded from `track_config`.
# ============================================================
group_id: G00                     # e.g. G07
owner: "TODO: tên người ký duyệt (role)"   # mandatory for every Decision
track_config: tracks/t08.yaml     # pick your challenge: tracks/t01.yaml ... tracks/t14.yaml
track: t08                        # must match track_config
input: fixtures/t08_deletion      # T08: mock graph only, never real data
output: out/
seed: 42
offline: true                     # demo/eval must not touch the network
strict_provenance: true           # fail if manifest.csv hashes do not match

# Track params (merged over track_config.params). Freeze before evaluation.
params:
  dry_run: true                   # true = plan only; false = tombstone in mock store (only when decision = GO)
  operator_role: data-platform    # role executing deletes; must be in an artefact's ACL
  review_budget: 60               # max rows in review_queue.csv (exceptions first)
  as_of: "2026-11-14T00:00:00+07:00"   # fixed clock for SLA (days to deadline) -> reproducible
